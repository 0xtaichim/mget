[package]
name = "mget"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Media metadata scraper for Emby/Kodi compatible NFO files"

[dependencies]
clap = { version = "4", features = ["derive"] }
dirs = "6"
futures-util = "0.3"
quick-xml = "0.37"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
toml = "0.8"

[profile.release]
lto = true
strip = true
